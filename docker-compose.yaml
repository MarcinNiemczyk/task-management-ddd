name: task-management

services:
  redis:
    container_name: task-management-redis
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    container_name: task-management-api
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    ports:
      - "8000:8000"
    command: uv run uvicorn src.infrastructure.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /app/.venv
      - sqlite_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  celery_worker:
    container_name: task-management-celery-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run celery -A src.infrastructure.celery.app:celery_app worker --loglevel=info
    volumes:
      - .:/app
      - /app/.venv
      - sqlite_data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

volumes:
  redis_data:
  sqlite_data:
